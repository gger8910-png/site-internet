<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <filter id="aiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer circle -->
  <circle cx="12" cy="12" r="10" stroke="url(#aiGradient)" stroke-width="2" fill="none" filter="url(#aiGlow)"/>
  
  <!-- Inner elements - Neural network pattern -->
  <g fill="none" stroke="url(#aiGradient)" stroke-width="1.5">
    <!-- Left hemisphere -->
    <path d="M7 10C7 7 9 5 12 5C15 5 17 7 17 10" opacity="0.6"/>
    <path d="M8 8C8 6 10 4 12 4C14 4 16 6 16 8" opacity="0.8"/>
    
    <!-- Right hemisphere -->
    <path d="M7 14C7 17 9 19 12 19C15 19 17 17 17 14" opacity="0.6"/>
    <path d="M8 16C8 18 10 20 12 20C14 20 16 18 16 16" opacity="0.8"/>
    
    <!-- Connections -->
    <path d="M12 8V12" opacity="0.8"/>
    <path d="M10 10L14 10" opacity="0.6"/>
    <path d="M10 12L14 12" opacity="0.6"/>
    <path d="M10 14L14 14" opacity="0.6"/>
  </g>
  
  <!-- Center dot -->
  <circle cx="12" cy="12" r="2" fill="url(#aiGradient)" filter="url(#aiGlow)"/>
  
  <!-- Sparkle effects -->
  <g fill="#60a5fa" opacity="0.8">
    <circle cx="8" cy="8" r="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="16" cy="16" r="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="16" cy="8" r="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="8" cy="16" r="1" opacity="0.6">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>
</svg>
