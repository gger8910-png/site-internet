<svg viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nnGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nnGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
    <filter id="nnGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="neuronGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Layer 1 (Input) -->
  <g id="layer1">
    <circle cx="20" cy="40" r="6" fill="url(#nnGradient2)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="80" r="6" fill="url(#nnGradient2)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="20" cy="120" r="6" fill="url(#nnGradient2)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="20" cy="160" r="6" fill="url(#nnGradient2)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
  </g>

  <!-- Layer 2 (Hidden) -->
  <g id="layer2">
    <circle cx="80" cy="20" r="6" fill="url(#nnGradient1)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.1s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.1s"/>
    </circle>
    <circle cx="80" cy="60" r="6" fill="url(#nnGradient1)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="80" cy="100" r="6" fill="url(#nnGradient1)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="80" cy="140" r="6" fill="url(#nnGradient1)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
    <circle cx="80" cy="180" r="6" fill="url(#nnGradient1)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.9s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="80" cy="220" r="6" fill="url(#nnGradient1)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
  </g>

  <!-- Layer 3 (Hidden) -->
  <g id="layer3">
    <circle cx="140" cy="30" r="6" fill="url(#nnGradient1)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.2s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="140" cy="70" r="6" fill="url(#nnGradient1)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.4s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="140" cy="110" r="6" fill="url(#nnGradient1)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <circle cx="140" cy="150" r="6" fill="url(#nnGradient1)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
  </g>

  <!-- Layer 4 (Output) -->
  <g id="layer4">
    <circle cx="180" cy="60" r="6" fill="url(#nnGradient2)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="180" cy="100" r="6" fill="url(#nnGradient2)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="180" cy="140" r="6" fill="url(#nnGradient2)" filter="url(#nnGlow)">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite" begin="0.7s"/>
    </circle>
  </g>

  <!-- Connections -->
  <g id="connections" stroke="url(#nnGradient1)" stroke-width="1" opacity="0.4">
    <!-- Layer 1 to Layer 2 -->
    <path d="M26 40L74 20" stroke-dasharray="5,5"/>
    <path d="M26 40L74 60" stroke-dasharray="5,5"/>
    <path d="M26 80L74 60" stroke-dasharray="5,5"/>
    <path d="M26 80L74 100" stroke-dasharray="5,5"/>
    <path d="M26 120L74 100" stroke-dasharray="5,5"/>
    <path d="M26 120L74 140" stroke-dasharray="5,5"/>
    <path d="M26 160L74 140" stroke-dasharray="5,5"/>
    <path d="M26 160L74 180" stroke-dasharray="5,5"/>
    
    <!-- Layer 2 to Layer 3 -->
    <path d="M86 20L134 30" stroke-dasharray="5,5"/>
    <path d="M86 20L134 70" stroke-dasharray="5,5"/>
    <path d="M86 60L134 30" stroke-dasharray="5,5"/>
    <path d="M86 60L134 70" stroke-dasharray="5,5"/>
    <path d="M86 60L134 110" stroke-dasharray="5,5"/>
    <path d="M86 100L134 70" stroke-dasharray="5,5"/>
    <path d="M86 100L134 110" stroke-dasharray="5,5"/>
    <path d="M86 100L134 150" stroke-dasharray="5,5"/>
    <path d="M86 140L134 110" stroke-dasharray="5,5"/>
    <path d="M86 140L134 150" stroke-dasharray="5,5"/>
    <path d="M86 180L134 150" stroke-dasharray="5,5"/>
    <path d="M86 220L134 150" stroke-dasharray="5,5"/>
    
    <!-- Layer 3 to Layer 4 -->
    <path d="M146 30L174 60" stroke-dasharray="5,5"/>
    <path d="M146 30L174 100" stroke-dasharray="5,5"/>
    <path d="M146 70L174 60" stroke-dasharray="5,5"/>
    <path d="M146 70L174 100" stroke-dasharray="5,5"/>
    <path d="M146 70L174 140" stroke-dasharray="5,5"/>
    <path d="M146 110L174 100" stroke-dasharray="5,5"/>
    <path d="M146 110L174 140" stroke-dasharray="5,5"/>
    <path d="M146 150L174 140" stroke-dasharray="5,5"/>
  </g>

  <!-- Animated connections -->
  <g id="animated-connections" stroke="#60a5fa" stroke-width="1.5" opacity="0.6">
    <path d="M26 80L74 100">
      <animate attributeName="stroke" values="#60a5fa;#3b82f6;#60a5fa" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M86 100L134 110">
      <animate attributeName="stroke" values="#60a5fa;#3b82f6;#60a5fa" dur="3s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M146 70L174 100">
      <animate attributeName="stroke" values="#60a5fa;#3b82f6;#60a5fa" dur="3s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="1s"/>
    </path>
  </g>

  <!-- Layer labels -->
  <g id="labels" fill="#60a5fa" font-family="Inter, sans-serif" font-size="10" font-weight="500">
    <text x="20" y="25" text-anchor="middle">Input</text>
    <text x="80" y="10" text-anchor="middle">Hidden</text>
    <text x="80" y="230" text-anchor="middle">Hidden</text>
    <text x="140" y="10" text-anchor="middle">Hidden</text>
    <text x="140" y="170" text-anchor="middle">Hidden</text>
    <text x="180" y="20" text-anchor="middle">Output</text>
    <text x="180" y="160" text-anchor="middle">Output</text>
  </g>
</svg>
